version: "3"

services:
  household-replacement-tracker:
    build: .
    container_name: household-replacement-tracker
    network_mode: host
    environment:
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-admin}
      - PORT=3000
      - TLS_MODE=off
      # Backup configuration
      - BACKUP_ENABLED=${BACKUP_ENABLED:-true}
      - BACKUP_DROPBOX_REFRESH_TOKEN=${BACKUP_DROPBOX_REFRESH_TOKEN:-}
      - BACKUP_DROPBOX_FOLDER=${BACKUP_DROPBOX_FOLDER:-/Backup}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 2 * * *}
    volumes:
      - hrt-data:/app/data
      - hrt-certs:/app/certs
    restart: unless-stopped

  # Web-based cert uploader - deploy temporarily to upload cPanel certs.
  # Only starts when explicitly enabled via --profile tools or COMPOSE_PROFILES=tools
  # IMPORTANT: Stop and remove this container after uploading (no auth!)!
  cert-uploader:
    build: ./certs/upload-server
    container_name: hrt-cert-uploader
    volumes:
      - hrt-certs:/certs
    ports:
      - "8081:8080"
    profiles: ["tools"]

volumes:
  hrt-data:
    external: true
  hrt-certs:
    external: true