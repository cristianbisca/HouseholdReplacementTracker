version: "3"

services:
  household-replacement-tracker:
    build: .
    container_name: household-replacement-tracker
    network_mode: host
    environment:
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-admin}
      - PORT=3000
      - TLS_MODE=auto
    volumes:
      - hrt-data:/app/data
      - hrt-certs:/app/certs
    restart: unless-stopped

  # Helper service for Let's Encrypt DNS-01 certificate management.
  # Run one-time commands via Portainer or docker compose run.
  # See README.md for instructions.
  acme:
    image: neilpang/acme.sh
    container_name: hrt-acme
    volumes:
      - hrt-certs:/acme.sh/certs
    entrypoint: ["acme.sh"]
    profiles: ["tools"]

volumes:
  hrt-data:
    external: true
  hrt-certs:
    external: true